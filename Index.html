<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mathe Lerncenter</title>

<style>
:root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel2: #1e222d;
    --border: #2b3040;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #6c8cff;
    --accent2: #8b5cf6;
    --green: #39c98a;
    --red: #ef6464;
    --yellow: #e6b84d;
    --shadow: 0 12px 35px rgba(0,0,0,.25);
}

.light {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel2: #f0f2f7;
    --border: #dfe3eb;
    --text: #171923;
    --muted: #687080;
    --shadow: 0 10px 30px rgba(30,40,70,.10);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: .2s;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 1250px;
    margin: auto;
    padding: 25px;
}

/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;
}

.logo-box {
    width: 45px;
    height: 45px;
    border-radius: 13px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    font-weight: 800;
    font-size: 20px;
}

.logo h1 {
    margin: 0;
    font-size: 21px;
}

.logo p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    width: 42px;
    height: 42px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 12px;
}

/* NAV */

nav {
    display: flex;
    gap: 7px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 6px;
    border-radius: 15px;
    margin-bottom: 25px;
    overflow-x: auto;
}

nav button {
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 11px 16px;
    border-radius: 10px;
    white-space: nowrap;
}

nav button.active {
    background: var(--panel2);
    color: var(--text);
}

/* HERO */

.hero {
    padding: 27px;
    border-radius: 20px;
    background:
        radial-gradient(circle at 90% 10%, rgba(108,140,255,.25), transparent 30%),
        linear-gradient(135deg, var(--panel), var(--panel2));
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
}

.hero h2 {
    margin: 0 0 7px;
    font-size: 28px;
}

.hero p {
    margin: 0;
    color: var(--muted);
}

/* DASHBOARD */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}

.stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 17px;
}

.stat-label {
    color: var(--muted);
    font-size: 12px;
}

.stat-value {
    font-size: 25px;
    font-weight: 800;
    margin-top: 5px;
}

/* CARDS */

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;
    padding: 20px;
    box-shadow: var(--shadow);
}

.card h3 {
    margin-top: 0;
}

.topic-card {
    cursor: pointer;
    transition: .18s;
}

.topic-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
}

.topic-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.topic-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: var(--panel2);
    font-weight: bold;
}

.progress {
    height: 7px;
    background: var(--panel2);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 13px;
}

.progress div {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: inherit;
}

/* BUTTONS */

.primary,
.secondary,
.danger {
    border: none;
    padding: 11px 16px;
    border-radius: 10px;
    font-weight: 600;
}

.primary {
    background: var(--accent);
    color: white;
}

.secondary {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--text);
}

.danger {
    background: rgba(239,100,100,.12);
    color: var(--red);
}

.actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

/* LEARNING */

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

select,
input,
textarea {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px;
}

textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
}

.task {
    margin-bottom: 15px;
}

.task-header {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    align-items: flex-start;
}

.badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.badge {
    font-size: 11px;
    padding: 5px 8px;
    border-radius: 7px;
    background: var(--panel2);
    color: var(--muted);
}

.badge.blue {
    color: var(--accent);
}

.badge.green {
    color: var(--green);
}

.badge.yellow {
    color: var(--yellow);
}

.solution {
    display: none;
    margin-top: 15px;
    padding: 17px;
    border-radius: 12px;
    background: var(--panel2);
    border-left: 3px solid var(--accent);
    line-height: 1.6;
}

.solution.show {
    display: block;
}

.answer {
    margin-top: 15px;
}

.hint {
    display: none;
    margin-top: 12px;
    padding: 13px;
    background: rgba(108,140,255,.08);
    border: 1px solid rgba(108,140,255,.2);
    border-radius: 10px;
    color: var(--muted);
}

.hint.show {
    display: block;
}

/* FORMULAS */

.formula-search {
    width: 100%;
    margin-bottom: 17px;
}

.formula-category {
    margin-bottom: 25px;
}

.formula-category h3 {
    margin-bottom: 10px;
}

.formula {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 9px;
    overflow: hidden;
}

.formula-head {
    padding: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}

.formula-name {
    font-weight: 700;
}

.formula-main {
    font-size: 19px;
    margin-top: 5px;
    font-family: "Times New Roman", serif;
}

.formula-body {
    display: none;
    padding: 0 16px 16px;
    color: var(--muted);
    line-height: 1.6;
}

.formula.open .formula-body {
    display: block;
}

.formula-body strong {
    color: var(--text);
}

/* CHECKLIST */

.check-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px;
    border-bottom: 1px solid var(--border);
}

.check-item:last-child {
    border-bottom: none;
}

.check-item input {
    margin-top: 3px;
}

/* QUICK TEST */

.quiz-option {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px;
    margin: 7px 0;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel2);
    color: var(--text);
}

.quiz-option:hover {
    border-color: var(--accent);
}

.quiz-option.correct {
    border-color: var(--green);
    background: rgba(57,201,138,.12);
}

.quiz-option.wrong {
    border-color: var(--red);
    background: rgba(239,100,100,.12);
}

/* EXAM */

.timer {
    font-size: 25px;
    font-weight: 800;
}

.exam-question {
    margin-bottom: 20px;
}

.points {
    color: var(--muted);
    font-size: 13px;
}

/* EMPTY */

.empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
}

/* MOBILE */

@media(max-width: 800px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .app {
        padding: 15px;
    }

    .hero h2 {
        font-size: 23px;
    }
}

@media(max-width: 500px) {
    header {
        align-items: flex-start;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .stat-value {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <div class="logo">
        <div class="logo-box">M</div>
        <div>
            <h1>Mathe Lerncenter</h1>
            <p>Abitur · Statistik & Wahrscheinlichkeit</p>
        </div>
    </div>

    <div class="header-actions">
        <button class="icon-btn" id="themeBtn">☾</button>
    </div>
</header>

<nav>
    <button class="nav-btn active" data-page="home">Übersicht</button>
    <button class="nav-btn" data-page="lernen">Lernen</button>
    <button class="nav-btn" data-page="klausur">Klausur</button>
    <button class="nav-btn" data-page="schnelltest">Schnelltest</button>
    <button class="nav-btn" data-page="formeln">Formeln</button>
    <button class="nav-btn" data-page="fortschritt">Fortschritt</button>
</nav>

<main id="content"></main>

</div>

<script>

const topics = {
    statistik: "Beschreibende Statistik",
    mehrstufig: "Mehrstufige Zufallsversuche",
    diskret: "Diskrete Wahrscheinlichkeitsverteilungen",
    binomial: "Binomialverteilung"
};

let stats = JSON.parse(localStorage.getItem("mathStats")) || {
    solved: 0,
    correct: 0,
    streak: 0,
    mistakes: 0,
    solvedTaskIds: [],
    mistakeTaskIds: []
};

let checklist = JSON.parse(localStorage.getItem("mathChecklist")) || {};

function save() {
    localStorage.setItem("mathStats", JSON.stringify(stats));
    localStorage.setItem("mathChecklist", JSON.stringify(checklist));
}

function shuffle(array) {
    return [...array].sort(() => Math.random() - .5);
}

/* =========================
   AUFGABEN
========================= */

const tasks = [

/* STATISTIK */

{
id:1,
topic:"statistik",
difficulty:"leicht",
noCalc:true,
question:"Eine Klasse schreibt einen Test. Die Punktzahlen lauten: 7, 9, 10, 10, 11, 13, 15. Bestimme Mittelwert, Median und Modalwert.",
hint:"Sortiert sind die Werte bereits. Der Median ist der mittlere Wert.",
solution:`
<strong>1. Mittelwert:</strong><br>
x̄ = (7 + 9 + 10 + 10 + 11 + 13 + 15) / 7 = 75 / 7 ≈ 10,71<br><br>

<strong>2. Median:</strong><br>
Es gibt 7 Werte. Der 4. Wert ist der mittlere Wert.<br>
Median = 10<br><br>

<strong>3. Modalwert:</strong><br>
10 kommt am häufigsten vor.<br>
Modalwert = 10
`
},

{
id:2,
topic:"statistik",
difficulty:"leicht",
noCalc:true,
question:"In einer Umfrage fahren 12 von 30 Schülern mit dem Bus. Bestimme die relative Häufigkeit.",
hint:"Relative Häufigkeit = absolute Häufigkeit / Gesamtzahl.",
solution:`
h = 12 / 30 = 0,4 = 40 %<br><br>
Die relative Häufigkeit beträgt <strong>40 %</strong>.
`
},

{
id:3,
topic:"statistik",
difficulty:"mittel",
noCalc:true,
question:"Eine Datenreihe hat die Werte 3, 5, 7, 8, 10, 12, 15. Bestimme Spannweite und Median.",
hint:"Spannweite = größter Wert − kleinster Wert.",
solution:`
Spannweite:<br>
R = 15 − 3 = <strong>12</strong><br><br>

Median:<br>
Der mittlere, also 4. Wert ist <strong>8</strong>.
`
},

{
id:4,
topic:"statistik",
difficulty:"mittel",
noCalc:true,
question:"Erkläre, was die Standardabweichung über eine Datenreihe aussagt.",
hint:"Überlege, wie weit die Werte typischerweise vom Mittelwert entfernt sind.",
solution:`
Die Standardabweichung beschreibt, wie stark die Werte um den Mittelwert streuen.<br><br>
<strong>Kleine Standardabweichung:</strong> Die Werte liegen relativ nah am Mittelwert.<br>
<strong>Große Standardabweichung:</strong> Die Werte sind stärker verteilt.
`
},

/* MEHRSTUFIG */

{
id:5,
topic:"mehrstufig",
difficulty:"leicht",
noCalc:true,
question:"Ein fairer Würfel wird zweimal geworfen. Wie groß ist die Wahrscheinlichkeit, zweimal eine 6 zu würfeln?",
hint:"Bei unabhängigen Würfen werden die Wahrscheinlichkeiten multipliziert.",
solution:`
P(6) = 1/6<br><br>
P(6 und 6) = 1/6 · 1/6 = <strong>1/36</strong>
`
},

{
id:6,
topic:"mehrstufig",
difficulty:"leicht",
noCalc:true,
question:"Eine Münze wird zweimal geworfen. Wie groß ist die Wahrscheinlichkeit für genau einmal Kopf?",
hint:"Es gibt zwei günstige Wege: Kopf-Zahl oder Zahl-Kopf.",
solution:`
P(KZ) = 1/2 · 1/2 = 1/4<br>
P(ZK) = 1/2 · 1/2 = 1/4<br><br>

P(genau einmal Kopf) = 1/4 + 1/4 = <strong>1/2</strong>
`
},

{
id:7,
topic:"mehrstufig",
difficulty:"mittel",
noCalc:true,
question:"In einer Urne liegen 3 rote und 2 blaue Kugeln. Es werden zwei Kugeln ohne Zurücklegen gezogen. Wie groß ist die Wahrscheinlichkeit, zweimal rot zu ziehen?",
hint:"Beim zweiten Zug sind insgesamt nur noch 4 Kugeln vorhanden.",
solution:`
P(RR) = 3/5 · 2/4<br>
= 6/20<br>
= <strong>3/10</strong>
`
},

{
id:8,
topic:"mehrstufig",
difficulty:"mittel",
noCalc:true,
question:"Erkläre den Unterschied zwischen P(A ∩ B) und P(A | B).",
hint:"Bei einer der beiden Schreibweisen wird vorausgesetzt, dass B bereits bekannt ist.",
solution:`
<strong>P(A ∩ B)</strong> bedeutet: A und B treten gemeinsam ein.<br><br>

<strong>P(A | B)</strong> bedeutet: Wie wahrscheinlich ist A, wenn bekannt ist, dass B eingetreten ist?<br><br>

Das Zeichen | bedeutet also sinngemäß <strong>„unter der Bedingung, dass“</strong>.
`
},

{
id:9,
topic:"mehrstufig",
difficulty:"mittel",
noCalc:true,
question:"Zwei Ereignisse A und B sind unabhängig. Es gilt P(A)=1/2 und P(B)=1/4. Bestimme P(A ∩ B).",
hint:"Bei unabhängigen Ereignissen gilt P(A ∩ B) = P(A) · P(B).",
solution:`
P(A ∩ B) = P(A) · P(B)<br>
= 1/2 · 1/4<br>
= <strong>1/8</strong>
`
},

/* DISKRET */

{
id:10,
topic:"diskret",
difficulty:"mittel",
noCalc:true,
question:"Eine Zufallsgröße X nimmt die Werte 0, 1 und 2 an. Die Wahrscheinlichkeiten sind 1/4, 1/2 und 1/4. Bestimme E(X).",
hint:"Multipliziere jeden Wert mit seiner Wahrscheinlichkeit und addiere.",
solution:`
E(X) = 0 · 1/4 + 1 · 1/2 + 2 · 1/4<br><br>
= 0 + 1/2 + 1/2<br>
= <strong>1</strong>
`
},

{
id:11,
topic:"diskret",
difficulty:"mittel",
noCalc:true,
question:"Was bedeutet der Erwartungswert einer Zufallsgröße?",
hint:"Er ist nicht unbedingt ein Wert, der tatsächlich bei einem einzelnen Versuch auftreten muss.",
solution:`
Der Erwartungswert beschreibt den <strong>durchschnittlich zu erwartenden Wert</strong> bei sehr vielen Wiederholungen eines Zufallsexperiments.
`
},

{
id:12,
topic:"diskret",
difficulty:"mittel",
noCalc:true,
question:"Ein Spiel kostet 2 €. Mit Wahrscheinlichkeit 1/2 gewinnt man 0 €, mit Wahrscheinlichkeit 1/4 gewinnt man 2 € und mit Wahrscheinlichkeit 1/4 gewinnt man 6 €. Ist das Spiel fair?",
hint:"Berechne zuerst den erwarteten Gewinn und vergleiche ihn mit dem Einsatz.",
solution:`
Erwartete Auszahlung:<br>
E(X) = 0 · 1/2 + 2 · 1/4 + 6 · 1/4<br>
= 0 + 1/2 + 3/2<br>
= <strong>2 €</strong><br><br>

Der Einsatz beträgt 2 €.<br>
Damit beträgt der erwartete Gewinn 0 €.<br><br>

Das Spiel ist nach diesem Kriterium <strong>fair</strong>.
`
},

/* BINOMIAL */

{
id:13,
topic:"binomial",
difficulty:"leicht",
noCalc:true,
question:"Ein fairer Münzwurf wird dreimal durchgeführt. X gibt die Anzahl der Köpfe an. Welche Verteilung besitzt X?",
hint:"Es gibt eine feste Anzahl von Versuchen und pro Versuch zwei mögliche Ergebnisse.",
solution:`
X ist binomialverteilt:<br><br>
<strong>X ~ B(3; 0,5)</strong><br><br>

n = 3 Versuche<br>
p = 0,5 Erfolgswahrscheinlichkeit
`
},

{
id:14,
topic:"binomial",
difficulty:"leicht",
noCalc:true,
question:"Bei einer Binomialverteilung mit n = 10 und p = 0,2: Bestimme den Erwartungswert.",
hint:"E(X) = n · p.",
solution:`
E(X) = n · p<br>
= 10 · 0,2<br>
= <strong>2</strong>
`
},

{
id:15,
topic:"binomial",
difficulty:"leicht",
noCalc:true,
question:"Bei einer Binomialverteilung mit n = 9 und p = 1/3: Bestimme den Erwartungswert.",
hint:"E(X)=n·p.",
solution:`
E(X) = 9 · 1/3<br>
= <strong>3</strong>
`
},

{
id:16,
topic:"binomial",
difficulty:"mittel",
noCalc:true,
question:"Ein Basketballspieler trifft einen Freiwurf mit Wahrscheinlichkeit 0,5. Er wirft 4-mal. Wie groß ist die Wahrscheinlichkeit, genau 2 Treffer zu erzielen?",
hint:"Verwende die Bernoulli-Formel.",
solution:`
P(X=2) = C(4,2) · 0,5² · 0,5²<br><br>

C(4,2) = 6<br><br>

P(X=2) = 6 · 0,25 · 0,25<br>
= <strong>6/16 = 3/8</strong>
`
},

{
id:17,
topic:"binomial",
difficulty:"mittel",
noCalc:true,
question:"Bei einer Binomialverteilung gilt n = 8 und p = 0,5. Bestimme die Standardabweichung.",
hint:"σ = √(n·p·(1−p)).",
solution:`
σ = √(8 · 0,5 · 0,5)<br>
= √2<br><br>

<strong>σ = √2 ≈ 1,41</strong>
`
},

{
id:18,
topic:"binomial",
difficulty:"mittel",
noCalc:true,
question:"Was bedeutet P(X ≤ 3) bei einer Binomialverteilung?",
hint:"Das Zeichen ≤ bedeutet „kleiner oder gleich“.",
solution:`
P(X ≤ 3) bedeutet:<br><br>

Die Wahrscheinlichkeit dafür, dass <strong>höchstens 3 Erfolge</strong> auftreten.<br><br>

Also:<br>
P(X≤3) = P(X=0)+P(X=1)+P(X=2)+P(X=3)
`
},

{
id:19,
topic:"binomial",
difficulty:"leicht",
noCalc:true,
question:"Was bedeutet P(X ≥ 1)?",
hint:"„Mindestens“ ist hier wichtig.",
solution:`
P(X ≥ 1) bedeutet: <strong>mindestens ein Erfolg</strong>.<br><br>

Oft ist das Gegenereignis einfacher:<br>
P(X≥1) = 1 − P(X=0)
`
},

/* REALISTISCHE AUFGABEN */

{
id:20,
topic:"binomial",
difficulty:"mittel",
noCalc:false,
realistic:true,
question:"Eine Fabrik produziert Schrauben. Erfahrungsgemäß sind 4 % der Schrauben fehlerhaft. Es werden 50 Schrauben zufällig ausgewählt. X bezeichnet die Anzahl fehlerhafter Schrauben. Bestimme die Wahrscheinlichkeit, dass genau 2 Schrauben fehlerhaft sind.",
hint:"Zuerst X definieren und die Binomialverteilung angeben. Danach die Bernoulli-Formel verwenden.",
solution:`
X = Anzahl der fehlerhaften Schrauben.<br><br>

X ~ B(50; 0,04)<br><br>

Gesucht ist P(X=2):<br><br>

P(X=2) = C(50,2) · 0,04² · 0,96⁴⁸<br><br>

Für die konkrete Dezimalzahl benötigt man einen Taschenrechner.
`
},

{
id:21,
topic:"mehrstufig",
difficulty:"mittel",
noCalc:false,
realistic:true,
question:"Ein medizinischer Test erkennt eine Krankheit mit einer Wahrscheinlichkeit von 95 %, wenn die Person tatsächlich krank ist. Bei gesunden Personen zeigt der Test mit Wahrscheinlichkeit 4 % trotzdem ein positives Ergebnis. Die Krankheit tritt bei 2 % der Bevölkerung auf. Bestimme die Wahrscheinlichkeit, dass eine zufällig ausgewählte Person tatsächlich krank ist, wenn der Test positiv ausfällt.",
hint:"Erstelle ein Baumdiagramm oder eine Vierfeldertafel. Gesucht ist eine bedingte Wahrscheinlichkeit.",
solution:`
Sei K = Person ist krank<br>
T = Test ist positiv<br><br>

Gegeben:<br>
P(K)=0,02<br>
P(T|K)=0,95<br>
P(T|K̄)=0,04<br><br>

Gesucht:<br>
P(K|T)<br><br>

Zuerst:<br>
P(K∩T)=0,02·0,95=0,019<br><br>

P(K̄∩T)=0,98·0,04=0,0392<br><br>

P(T)=0,019+0,0392=0,0582<br><br>

function applyTaskFilters() {

    const topic = document.getElementById("topicFilter").value;
    const difficulty = document.getElementById("difficultyFilter").value;
    const noCalc = document.getElementById("noCalcFilter").checked;

    let filtered = tasks.filter(task => {

        if(topic !== "alle" && task.topic !== topic) return false;
        if(difficulty !== "alle" && task.difficulty !== difficulty) return false;
        if(noCalc && !task.noCalc) return false;

        return true;
    });

    renderTaskList(filtered);
}

/* =========================
   TASK ACTIONS
========================= */

function toggleSolution(id) {
    document.getElementById(`solution-${id}`).classList.toggle("show");
}

function toggleHint(id) {
    document.getElementById(`hint-${id}`).classList.toggle("show");
}

function rateTask(id, correct) {

    stats.solved++;

    if(correct) {

        stats.correct++;
        stats.streak++;

        stats.solvedTaskIds = [
            ...new Set([...stats.solvedTaskIds, id])
        ];

        stats.mistakeTaskIds =
            stats.mistakeTaskIds.filter(x => x !== id);

    } else {

        stats.mistakes++;
        stats.streak = 0;

        if(!stats.mistakeTaskIds.includes(id)) {
            stats.mistakeTaskIds.push(id);
        }
    }

    save();
    updateHomeIfVisible();
}

function showMistakes() {

    const mistakeTasks = tasks.filter(t =>
        stats.mistakeTaskIds.includes(t.id)
    );

    const container = document.getElementById("taskList");

    if(!mistakeTasks.length) {
        container.innerHTML = `
            <div class="card empty">
                Aktuell keine offenen Fehler.
            </div>
        `;
        return;
    }

    renderTaskList(mistakeTasks);
}

let currentQuiz = [];

function renderSchnelltest() {

    currentQuiz = shuffle(quizQuestions).slice(0,10);

    document.getElementById("content").innerHTML = `

        <div class="hero">
            <h2>Schnelltest</h2>
            <p>10 kurze Fragen. Keine Hilfsmittel.</p>
        </div>

        <div id="quizContainer"></div>

        <button class="primary" onclick="renderSchnelltest()">
            Neuer Test
        </button>
    `;

    renderQuiz();
}

function renderQuiz() {

    document.getElementById("quizContainer").innerHTML =
        currentQuiz.map((q,index) => `

        <div class="card" style="margin-bottom:15px">

            <div class="points">
                Frage ${index+1} von ${currentQuiz.length}
            </div>

            <h3>${q.q}</h3>

            ${q.options.map((option,i) => `
                <button
                    class="quiz-option"
                    onclick="answerQuiz(this,${index},${i})">
                    ${option}
                </button>
            `).join("")}

            <div
                id="quiz-exp-${index}"
                style="display:none;margin-top:10px;color:var(--muted)">
            </div>

        </div>

    `).join("");
}

function answerQuiz(button,index,choice) {

    const question = currentQuiz[index];

    const buttons =
        button.parentElement.querySelectorAll(".quiz-option");

    buttons.forEach(b => b.disabled = true);

    if(choice === question.correct) {
        button.classList.add("correct");
        stats.correct++;
        stats.streak++;
    } else {
        button.classList.add("wrong");
        buttons[question.correct].classList.add("correct");
        stats.streak = 0;
        stats.mistakes++;
    }

    stats.solved++;
    save();

    const explanation =
        document.getElementById(`quiz-exp-${index}`);

    explanation.style.display = "block";
    explanation.innerHTML = question.exp;
}

let examTimer = null;
let examSeconds = 45 * 60;

function renderKlausur() {

    clearInterval(examTimer);

    examSeconds = 45 * 60;

    document.getElementById("content").innerHTML = `

        <div class="hero">

            <div style="display:flex;justify-content:space-between;gap:15px;align-items:center">

                <div>
                    <h2>Klausurmodus</h2>
                    <p>
                        Keine Lösungen während der Bearbeitung.
                    </p>
                </div>

                <div class="timer" id="timer">
                    45:00
                </div>

            </div>

        </div>

        <div id="examTasks"></div>

        <button class="primary" onclick="finishExam()">
            Klausur abgeben
        </button>
    `;

    const examTasks = shuffle(tasks).slice(0,8);

    document.getElementById("examTasks").innerHTML =
        examTasks.map((task,index) => `

        <div class="card exam-question">

            <div class="points">
                Aufgabe ${index+1} · ${task.difficulty}
            </div>

            <h3>${task.question}</h3>

            <textarea
                id="exam-answer-${task.id}"
                placeholder="Deine vollständige Lösung...">
            </textarea>

        </div>

    `).join("");

    examTimer = setInterval(() => {

        examSeconds--;

        if(examSeconds <= 0) {
            clearInterval(examTimer);
            finishExam();
        }

        const min = Math.floor(examSeconds / 60);
        const sec = examSeconds % 60;

        document.getElementById("timer").textContent =
            `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

    },1000);
}

function finishExam() {

    clearInterval(examTimer);

    document.getElementById("content").innerHTML = `

        <div class="hero">
            <h2>Klausur abgegeben</h2>
            <p>
                Vergleiche deine Lösungen jetzt selbst mit den Musterlösungen.
            </p>
        </div>

        <div class="card">
            <h3>Wie lief es?</h3>

            <p>
                Bewerte dich ehrlich. Die Seite versucht nicht,
                deine freien Antworten mit einer KI zu bewerten.
                Du bekommst stattdessen die vollständige Lösung
                und kannst deine Punkte selbst einschätzen.
            </p>

            <div class="actions">

                <button class="primary"
                    onclick="openPage('lernen')">
                    Lösungen üben
                </button>

                <button class="secondary"
                    onclick="openPage('fortschritt')">
                    Fortschritt ansehen
                </button>

            </div>
        </div>
    `;
}

========================= */

function openPage(page) {

    document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
    });

    renderPage(page);
}

function openLearningTopic(topic) {

    document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === "lernen");
    });

    renderLernen(topic);
}

function updateHomeIfVisible() {

    const active =
        document.querySelector(".nav-btn.active");

    if(active && active.dataset.page === "home") {
        renderHome();
    }
}

function renderPage(page) {

    if(page === "home") renderHome();
    if(page === "lernen") renderLernen();
    if(page === "formeln") renderFormulas();
    if(page === "fortschritt") renderFortschritt();
    if(page === "schnelltest") renderSchnelltest();
    if(page === "klausur") renderKlausur();
}
